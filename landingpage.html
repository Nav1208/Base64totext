<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Decoder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #181825;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #89b4fa;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #a6adc8;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #313244;
            border: 1px solid #45475a;
            border-radius: 5px;
            color: #a6e3a1;
            font-family: monospace;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #b4befe;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #313244;
            border-radius: 5px;
            border-left: 5px solid #a6e3a1;
            word-break: break-all;
        }
        .result-title {
            font-size: 12px;
            color: #a6adc8;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .flag {
            font-family: monospace;
            font-size: 18px;
            color: #a6e3a1;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Hex Rot13, Rot19</h2>
    
    <label for="encoded">Encoded Array:</label>
    <textarea id="encoded" rows="3" placeholder="Ahabehja"></textarea>

    <label for="k1">Decimal:</label>
    <input type="number" id="k1" placeholder="e.g. oX01">

    <label for="k2">hex</label>
    <input type="number" id="k2" placeholder="e.g. 03x1">

    <button onclick="decodeFlag()">try</button>

    <div class="result-box">
        <div class="result-title">output:</div>
        <div id="output" class="flag">Waiting for input...</div>
    </div>
</div>

<script>
function decodeFlag() {
    try {
        let rawEncoded = document.getElementById("encoded").value.trim();
        let k1 = parseInt(document.getElementById("k1").value);
        let k2 = parseInt(document.getElementById("k2").value);

        if (!rawEncoded || isNaN(k1) || isNaN(k2)) {
            document.getElementById("output").innerText = "Please fill in all fields.";
            return;
        }

        // Clean array string and convert to numbers
        let cleaned = rawEncoded.replace(/\[|\]/g, "");
        let numbers = cleaned.split(",").map(num => parseInt(num.trim()));

        // Perform decoding operation: ((x ^ k2) - k1) % 256
        let result = "";
        for (let x of numbers) {
            let val = ((x ^ k2) - k1) % 256;
            if (val < 0) val += 256; // Handle negative modulo in JS
            result += String.fromCharCode(val);
        }

        document.getElementById("output").innerText = result;
    } catch (e) {
        document.getElementById("output").innerText = "Error decoding array syntax!";
    }
}
</script>

</body>
</html>
